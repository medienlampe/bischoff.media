<!doctype html>
<!--
  Template for the social preview image (Open Graph / Twitter card), 1200×630.
  Re-render after changing it, from the repo root:

    python3 -m http.server 8765 &
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
      --virtual-time-budget=3000 --screenshot=/tmp/social-card.png \
      http://localhost:8765/tools/social-card.html
    sips -s format jpeg -s formatOptions 85 /tmp/social-card.png \
      --out dist/assets/img/social-card.jpg
-->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Social card</title>
<style>
  @font-face {
    font-family: "Geist";
    font-weight: 100 900;
    src: url("../dist/assets/fonts/geist-latin-wght-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Geist Pixel";
    src: url("../dist/assets/fonts/geist-pixel-latin-400-normal.woff2") format("woff2");
  }
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    padding: 80px 88px;
    display: flex;
    align-items: center;
    gap: 72px;
    background: #121211;
    color: #ecebe7;
    font-family: "Geist", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  img {
    width: 400px;
    height: 400px;
    border-radius: 32px;
    object-fit: cover;
    flex: none;
  }
  .text { display: flex; flex-direction: column; min-width: 0; }
  .whoami { font: 32px "Geist Pixel"; color: #a3a09a; margin: 0 0 18px; }
  .whoami span { color: #2dd4bf; }
  h1 { font: 92px/1 "Geist Pixel"; margin: 0; letter-spacing: 0; }
  .role { font-size: 36px; font-weight: 500; color: #a3a09a; margin: 28px 0 0; line-height: 1.3; }
  .url { font: 30px "Geist Pixel"; color: #2dd4bf; margin: 56px 0 0; }
</style>
</head>
<body>
  <img src="../dist/assets/img/sb.webp" alt="">
  <div class="text">
    <p class="whoami"><span>$</span> whoami</p>
    <h1>Sven Bischoff</h1>
    <p class="role">Senior Engineering Manager<br>Leipzig</p>
    <p class="url">bischoff.media</p>
  </div>
</body>
</html>
